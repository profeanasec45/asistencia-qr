<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#0B2A4A">
  <title>Generar QR de alumno</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:#f4f7fb;color:#1f2937
    }
    .app{width:min(100%,580px);margin:auto;padding:16px}
    .header{
      background:#0B2A4A;color:#fff;padding:20px;border-radius:18px;margin-bottom:14px
    }
    .header h1{margin:0;font-size:25px}
    .header p{margin:6px 0 0;opacity:.85}
    .card{
      background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;
      box-shadow:0 3px 12px rgba(0,0,0,.06)
    }
    label{display:block;font-weight:800;margin-bottom:7px}
    input{
      width:100%;min-height:50px;padding:12px;border:1px solid #cbd5e1;
      border-radius:12px;font-size:17px;margin-bottom:12px;background:#fff;
      text-transform:uppercase
    }
    button{
      width:100%;min-height:50px;border:0;border-radius:12px;font-size:16px;
      font-weight:800;padding:12px;cursor:pointer;margin-top:6px
    }
    .primary{background:#0B2A4A;color:#fff}
    .secondary{background:#e8eef5;color:#0B2A4A}
    .status{display:none;padding:13px;border-radius:12px;margin-bottom:14px;font-weight:700}
    .ok{display:block;background:#dcfce7;color:#166534}
    .error{display:block;background:#fee2e2;color:#991b1b}
    .warning{display:block;background:#fef3c7;color:#92400e}
    .hidden{display:none!important}
    .qrCard{
      border:2px solid #0B2A4A;border-radius:18px;padding:18px;text-align:center;
      background:#fff
    }
    .qrTitle{font-size:20px;font-weight:900;color:#0B2A4A}
    .qrName{font-size:22px;font-weight:900;line-height:1.15;margin-top:10px}
    .qrMeta{font-size:17px;font-weight:700;margin-top:7px}
    #qrCanvas{display:flex;justify-content:center;align-items:center;margin:16px auto} #qrCanvas img,#qrCanvas canvas{max-width:100%;height:auto!important}
    .qrId{font-family:monospace;font-size:19px;font-weight:900;letter-spacing:.5px}
    .help{font-size:14px;color:#64748b;line-height:1.4}
    @media print{
      body{background:#fff}
      .header,.formCard,.actions,.status,.help{display:none!important}
      .app{padding:0;width:100%}
      .card{box-shadow:none;margin:0;padding:0}
      .qrCard{width:90mm;margin:10mm auto;border:2px solid #000}
    }
  </style>
</head>
<body>
<main class="app">
  <section class="header">
    <h1>🪪 Generar QR de alumno</h1>
    <p>Para alumnos nuevos · QR permanente</p>
  </section>

  <div id="mensaje" class="status"></div>

  <section class="card formCard">
    <label for="pin">PIN de acceso</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Escribe tu PIN">

    <label for="idAlumno">ID permanente del alumno</label>
    <input id="idAlumno" type="text" autocomplete="off" placeholder="Ejemplo: ALU-0228">

    <button id="generar" class="primary">Generar QR</button>
    <p class="help">
      Después de agregar al alumno en la hoja Alumnos, espera a que aparezca su ID
      ALU-####. Escríbelo aquí y la tarjeta se genera automáticamente.
    </p>
  </section>

  <section id="resultado" class="card hidden">
    <div class="qrCard">
      <div class="qrTitle">ASISTENCIA QR</div>
      <div id="nombre" class="qrName"></div>
      <div id="meta" class="qrMeta"></div>
      <div id="qrCanvas" aria-label="Código QR del alumno"></div>
      <div id="qrId" class="qrId"></div>
    </div>

    <div class="actions">
      <button id="imprimir" class="primary">🖨 Imprimir tarjeta</button>
      <button id="guardarPng" class="secondary">Guardar QR como PNG</button>
    </div>
  </section>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx4xBisUluV6eAbiLwG5K0phEWNdl8fUOJF68M66YqWetADrT-Zu0Mu86PFvKlT2oJS/exec';

const pin = document.getElementById('pin');
const idAlumno = document.getElementById('idAlumno');
const generar = document.getElementById('generar');
const mensaje = document.getElementById('mensaje');
const resultado = document.getElementById('resultado');
const nombre = document.getElementById('nombre');
const meta = document.getElementById('meta');
const qrId = document.getElementById('qrId');
const qrCanvas = document.getElementById('qrCanvas');
const imprimir = document.getElementById('imprimir');
const guardarPng = document.getElementById('guardarPng');

function mostrar(texto, tipo){
  mensaje.className = 'status ' + tipo;
  mensaje.textContent = texto;
}

function jsonp(params, timeoutMs=12000){
  return new Promise((resolve,reject)=>{
    const cb='__qr_alumno_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error('Tiempo de espera agotado.'));
    },timeoutMs);

    function cleanup(){
      clearTimeout(timer);
      try{delete window[cb]}catch(e){window[cb]=undefined}
      if(script.parentNode)script.parentNode.removeChild(script);
    }

    window[cb]=data=>{cleanup();resolve(data)};

    const url=new URL(API_URL);
    url.searchParams.set('api','1');
    url.searchParams.set('callback',cb);
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v??'')));
    url.searchParams.set('_',Date.now());

    script.src=url.toString();
    script.onerror=()=>{
      cleanup();
      reject(new Error('No fue posible conectar con Apps Script.'));
    };
    document.head.appendChild(script);
  });
}

generar.addEventListener('click', async ()=>{
  const p=pin.value.trim();
  const id=idAlumno.value.trim().toUpperCase();

  if(!p){
    mostrar('Escribe tu PIN.','warning');
    return;
  }
  if(!/^ALU-\d{4,}$/.test(id)){
    mostrar('Escribe un ID válido, por ejemplo ALU-0228.','warning');
    return;
  }
  if(typeof QRCode==='undefined'){
    mostrar('No se cargó el generador QR. Revisa tu conexión.','error');
    return;
  }

  generar.disabled=true;
  generar.textContent='Buscando alumno…';
  resultado.classList.add('hidden');

  try{
    const r=await jsonp({accion:'alumno',pin:p,qr:id});

    if(!r.ok || !r.alumno){
      mostrar(r.mensaje || 'Alumno no encontrado.','error');
      return;
    }

    const a=r.alumno;
    nombre.textContent=a.nombre;
    meta.textContent=a.grupo+' · No. '+(a.numeroLista || '—');
    qrId.textContent=a.qrId || a.idAlumno;

    qrCanvas.innerHTML='';
    new QRCode(qrCanvas, {
      text: a.qrId || a.idAlumno,
      width: 340,
      height: 340,
      correctLevel: QRCode.CorrectLevel.M
    });

    resultado.classList.remove('hidden');
    mostrar('✓ QR generado correctamente.','ok');

  }catch(err){
    mostrar('Error: '+err.message,'error');
  }finally{
    generar.disabled=false;
    generar.textContent='Generar QR';
  }
});

idAlumno.addEventListener('input',()=>{
  idAlumno.value=idAlumno.value.toUpperCase();
});

imprimir.addEventListener('click',()=>window.print());

guardarPng.addEventListener('click',()=>{
  const canvas=qrCanvas.querySelector('canvas');
  const img=qrCanvas.querySelector('img');
  const link=document.createElement('a');
  link.download=(qrId.textContent || 'QR-alumno')+'.png';
  if(canvas){
    link.href=canvas.toDataURL('image/png');
  }else if(img){
    link.href=img.src;
  }else{
    mostrar('Primero genera el QR.','warning');
    return;
  }
  link.click();
});
</script>
</body>
</html>
