<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d98e9b"><title>Escáner QR Pro</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7f8;color:#2c2728}.wrap{max-width:760px;margin:auto;padding:22px}.brand{text-align:center;margin:8px 0 20px}.brand b{letter-spacing:2px;color:#c66f82}.card{background:#fff;border:1px solid #efd8dd;border-radius:22px;padding:18px;box-shadow:0 14px 35px #9d64721f}.viewer{position:relative;border-radius:18px;overflow:hidden;background:#171717;aspect-ratio:4/3}video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;inset:18%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px #0004}.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}button,input{font:inherit;border-radius:12px;padding:13px 15px}button{border:0;background:#d47e90;color:white;font-weight:700;cursor:pointer}button.alt{background:#eee;color:#333}input{border:1px solid #e4cbd1;flex:1;min-width:220px}.result{margin-top:16px;padding:20px;border-radius:18px;text-align:center;background:#fafafa;min-height:110px;display:grid;place-items:center}.ok{background:#edf9f0;border:1px solid #bfe2c7}.err{background:#fff0f1;border:1px solid #efc1c6}.name{font-family:Georgia,serif;font-size:24px;font-weight:700}.info{margin-top:7px;font-size:14px;line-height:1.5}.status{font-size:13px;margin:12px 0;text-align:center;color:#6c6063}canvas{display:none}</style></head>
<body><div class="wrap"><div class="brand"><b>♡ ASISTENCIA QR PRO</b><h1>Escáner QR</h1></div><div class="card"><div class="viewer"><video id="video" playsinline muted></video><div class="frame"></div></div><canvas id="canvas"></canvas><div id="status" class="status">Preparando cámara…</div><div class="row"><button id="start">Activar cámara</button><button id="stop" class="alt">Detener</button></div><div class="row"><input id="manual" placeholder="Lectura manual / lector USB"><button id="register">Registrar</button></div><div id="result" class="result"><div><div class="name">Listo para escanear</div><div class="info">Apunta la cámara al QR del alumno.</div></div></div></div></div>
<script>
const q=new URLSearchParams(location.search), TOKEN=q.get('token')||'', API=q.get('api')||'';
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),statusEl=document.getElementById('status'),result=document.getElementById('result');let stream=null,scanning=false,raf=null,busy=false,last='',lastAt=0;
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('Tiempo de espera agotado.'))},15000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};params.api='scanner';params.token=TOKEN;params.callback=cb;s.src=API+'?'+new URLSearchParams(params).toString();s.onerror=()=>{cleanup();reject(new Error('No se pudo conectar con Asistencia QR Pro.'))};document.body.appendChild(s)})}
async function start(){if(!TOKEN||!API){show({ok:false,mensaje:'Abre el escáner desde Asistencia QR Pro.'});return}if(typeof jsQR==='undefined'){show({ok:false,mensaje:'No se cargó el lector QR.'});return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();scanning=true;statusEl.textContent='Cámara activa · buscando QR…';loop()}catch(e){show({ok:false,mensaje:'No se pudo abrir la cámara: '+(e.message||e)});statusEl.textContent='Cámara no disponible.'}}
function stop(){scanning=false;if(raf)cancelAnimationFrame(raf);raf=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;statusEl.textContent='Cámara detenida.'}
function loop(){if(!scanning)return;if(video.readyState>=2&&video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);const im=ctx.getImageData(0,0,canvas.width,canvas.height);const c=jsQR(im.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(c&&c.data)detected(String(c.data).trim())}raf=requestAnimationFrame(loop)}
function detected(v){const now=Date.now();if(busy||!v||(v===last&&now-lastAt<4000))return;last=v;lastAt=now;register(v)}
async function register(v){if(busy)return;busy=true;statusEl.textContent='QR detectado · registrando…';try{const r=await jsonp({accion:'registrar',qr:v,tipo:'PRESENTE'});show(r);statusEl.textContent=r&&r.ok?'Registro completado.':'Listo para continuar.'}catch(e){show({ok:false,mensaje:e.message})}finally{setTimeout(()=>busy=false,1800)}}
function show(r){if(r&&r.ok){const a=r.alumno||{};result.className='result ok';result.innerHTML='<div><div style="font-size:42px">✓</div><div class="name">'+esc(a.nombre||'Asistencia registrada')+'</div><div class="info">Grupo '+esc(a.grupo||'')+' · Núm. '+esc(a.numLista||'')+'<br><b>'+esc(r.estatus||'PRESENTE')+'</b> · '+esc(r.hora||'')+'</div></div>'}else{result.className='result err';result.innerHTML='<div><div style="font-size:38px">!</div><div class="name">No registrado</div><div class="info">'+esc((r&&r.mensaje)||'No fue posible registrar.')+'</div></div>'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;document.getElementById('register').onclick=()=>{const v=document.getElementById('manual').value.trim();if(v)register(v)};document.getElementById('manual').onkeydown=e=>{if(e.key==='Enter')document.getElementById('register').click()};window.addEventListener('pagehide',stop);jsonp({accion:'ping'}).then(()=>statusEl.textContent='Conectado · pulsa Activar cámara.').catch(()=>statusEl.textContent='Pulsa Activar cámara.');
</script></body></html>
