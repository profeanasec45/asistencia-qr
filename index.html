<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Asistencia QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#1f2937}
    .app{width:min(100%,560px);margin:auto;padding:16px}
    .header{background:#0B2A4A;color:#fff;padding:20px;border-radius:18px;margin-bottom:14px}
    .header h1{margin:0;font-size:25px}.header p{margin:6px 0 0;opacity:.85}
    .card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
    label{display:block;font-weight:700;margin-bottom:7px}
    input,select{width:100%;min-height:48px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;margin-bottom:12px;background:#fff}
    button{width:100%;min-height:50px;border:0;border-radius:12px;font-size:16px;font-weight:700;padding:12px;cursor:pointer;margin-top:6px}
    button:disabled{opacity:.55}.primary{background:#0B2A4A;color:#fff}.camera{background:#177245;color:#fff;font-size:18px}
    .stop{background:#fee2e2;color:#991b1b}.secondary{background:#e8eef5;color:#0B2A4A}
    .status{display:none;padding:14px;border-radius:14px;margin-bottom:14px;font-weight:700;line-height:1.35}
    .ok{display:block;background:#dcfce7;color:#166534}.warning{display:block;background:#fef3c7;color:#92400e}.error{display:block;background:#fee2e2;color:#991b1b}
    #reader{width:100%;overflow:hidden;border-radius:14px;margin-top:12px}#reader video{border-radius:14px}
    .scannerText{text-align:center;color:#64748b;font-size:14px;margin-top:10px}.hidden{display:none}
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <h1>📱 Asistencia QR</h1>
      <p>Escáner externo · Ciclo 2026–2027</p>
    </section>

    <div id="mensaje" class="status"></div>

    <section class="card">
      <label for="pin">PIN de acceso</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Escribe tu PIN">
      <button id="conectar" class="primary">Conectar con asistencia</button>
    </section>

    <section id="panelClase" class="card hidden">
      <label for="clase">Clase</label>
      <select id="clase"><option value="">Selecciona una clase</option></select>
      <label for="tipo">Tipo de registro</label>
      <select id="tipo">
        <option value="PRESENTE">Presente</option>
        <option value="RETARDO">Retardo</option>
        <option value="JUSTIFICADA">Justificada</option>
        <option value="FALTA">Falta</option>
      </select>
    </section>

    <section id="panelScanner" class="card hidden">
      <button id="iniciar" class="camera">📷 INICIAR ESCÁNER QR</button>
      <button id="detener" class="stop hidden">⏹ Detener escáner</button>
      <div id="reader"></div>
      <div id="scannerText" class="scannerText">Selecciona una clase e inicia la cámara.</div>
    </section>

    <section id="panelManual" class="card hidden">
      <label for="codigo">Registro manual por código</label>
      <input id="codigo" type="text" autocomplete="off" placeholder="ID o QR del alumno">
      <button id="registrarManual" class="secondary">Registrar manualmente</button>
    </section>
  </main>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbx4xBisUluV6eAbiLwG5K0phEWNdl8fUOJF68M66YqWetADrT-Zu0Mu86PFvKlT2oJS/exec';

  const pin = document.getElementById('pin');
  const conectar = document.getElementById('conectar');
  const clase = document.getElementById('clase');
  const tipo = document.getElementById('tipo');
  const iniciar = document.getElementById('iniciar');
  const detener = document.getElementById('detener');
  const codigo = document.getElementById('codigo');
  const registrarManual = document.getElementById('registrarManual');
  const mensaje = document.getElementById('mensaje');
  const scannerText = document.getElementById('scannerText');

  let html5QrCode = null;
  let escanerActivo = false;
  let procesando = false;
  let ultimoQR = '';
  let ultimoTiempo = 0;
  let pinActual = '';

  function mostrar(texto, claseCss){
    mensaje.className = 'status ' + claseCss;
    mensaje.textContent = texto;
  }

  function jsonp(params, timeoutMs = 12000){
    return new Promise((resolve, reject) => {
      const cb = '__qr_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
      const script = document.createElement('script');
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('Tiempo de espera agotado.'));
      }, timeoutMs);

      function cleanup(){
        clearTimeout(timer);
        try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
        if(script.parentNode) script.parentNode.removeChild(script);
      }

      window[cb] = data => { cleanup(); resolve(data); };

      const url = new URL(API_URL);
      url.searchParams.set('api','1');
      url.searchParams.set('callback',cb);
      Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v == null ? '' : String(v)));
      url.searchParams.set('_',Date.now());

      script.src = url.toString();
      script.onerror = () => { cleanup(); reject(new Error('No fue posible conectar con Apps Script.')); };
      document.head.appendChild(script);
    });
  }

  conectar.addEventListener('click', async () => {
    const valorPin = pin.value.trim();

    if(!valorPin){
      mostrar('Escribe el PIN de acceso.','warning');
      return;
    }

    conectar.disabled = true;
    conectar.textContent = 'Conectando...';

    try{
      const r = await jsonp({accion:'clases', pin:valorPin});

      if(!r.ok){
        mostrar(r.mensaje || 'No se pudo conectar.','error');
        return;
      }

      pinActual = valorPin;
      clase.innerHTML = '<option value="">Selecciona una clase</option>';

      (r.clases || []).forEach(c => {
        const op = document.createElement('option');
        op.value = c.idClase;
        op.textContent = c.grupo + ' · ' + c.asignatura;
        clase.appendChild(op);
      });

      document.getElementById('panelClase').classList.remove('hidden');
      document.getElementById('panelScanner').classList.remove('hidden');
      document.getElementById('panelManual').classList.remove('hidden');

      pin.value = '';
      mostrar('✓ Conectado. Selecciona la clase.','ok');

    }catch(err){
      mostrar('Error de conexión: ' + err.message,'error');
    }finally{
      conectar.disabled = false;
      conectar.textContent = 'Conectar con asistencia';
    }
  });

  iniciar.addEventListener('click', async () => {
    if(!clase.value){
      mostrar('Selecciona una clase.','warning');
      return;
    }

    try{
      html5QrCode = new Html5Qrcode('reader');
      scannerText.textContent = 'Abriendo cámara...';

      await html5QrCode.start(
        {facingMode:'environment'},
        {fps:10, qrbox:{width:240,height:240}, aspectRatio:1},
        qrDetectado,
        () => {}
      );

      escanerActivo = true;
      iniciar.classList.add('hidden');
      detener.classList.remove('hidden');
      scannerText.textContent = 'Apunta al QR del alumno.';

    }catch(err){
      html5QrCode = null;
      escanerActivo = false;
      mostrar('No se pudo abrir la cámara: ' + (err && err.message ? err.message : err),'error');
      scannerText.textContent = 'Verifica el permiso de cámara para este sitio.';
    }
  });

  detener.addEventListener('click', async () => {
    if(!html5QrCode || !escanerActivo) return;

    try{
      await html5QrCode.stop();
      await html5QrCode.clear();
    }catch(e){}

    html5QrCode = null;
    escanerActivo = false;
    procesando = false;
    iniciar.classList.remove('hidden');
    detener.classList.add('hidden');
    scannerText.textContent = 'Escáner detenido.';
  });

  function qrDetectado(texto){
    const qr = String(texto || '').trim();
    if(!qr || procesando) return;

    const ahora = Date.now();
    if(qr === ultimoQR && ahora - ultimoTiempo < 4000) return;

    ultimoQR = qr;
    ultimoTiempo = ahora;
    registrar(qr, true);
  }

  registrarManual.addEventListener('click', () => {
    const qr = codigo.value.trim();
    if(!qr){
      mostrar('Escribe el ID o QR del alumno.','warning');
      return;
    }
    registrar(qr, false);
  });

  codigo.addEventListener('keydown', e => {
    if(e.key === 'Enter') registrarManual.click();
  });

  async function registrar(qr, desdeCamara){
    if(procesando) return;

    procesando = true;
    if(desdeCamara) scannerText.textContent = 'Registrando...';

    try{
      const r = await jsonp({
        accion:'registrar',
        pin:pinActual,
        qr:qr,
        idClase:clase.value,
        tipo:tipo.value
      });

      if(r.ok){
        mostrar('✓ ' + r.alumno.nombre + ' · ' + r.tipo + ' · ' + r.hora,'ok');
        codigo.value = '';

        if(navigator.vibrate) navigator.vibrate(100);

        if(desdeCamara){
          scannerText.textContent = '✓ Registrado. Listo para el siguiente QR.';
          setTimeout(() => {
            if(escanerActivo) scannerText.textContent = 'Apunta al siguiente QR.';
          },900);
        }

      }else{
        mostrar(r.mensaje || 'No se pudo registrar.', r.duplicado ? 'warning' : 'error');

        if(desdeCamara){
          scannerText.textContent = r.duplicado
            ? 'Ya estaba registrado. Puedes pasar al siguiente.'
            : 'No registrado. Intenta nuevamente.';
        }
      }

    }catch(err){
      mostrar('Error: ' + err.message,'error');
      if(desdeCamara) scannerText.textContent = 'Error de conexión. Intenta otra vez.';
    }finally{
      procesando = false;
    }
  }
</script>
</body>
</html>
